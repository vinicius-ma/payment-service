version: '3.9'

services:
  ms-payments:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-payments-app:latest
    container_name: ms-payments
    environment:
      - SPRING_PROFILES_ACTIVE=prod,fakeCheckoutClient
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payments-db:5432/payments
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_FLYWAY_URL=jdbc:postgresql://payments-db:5432/payments
      - SPRING_FLYWAY_USER=admin
      - SPRING_FLYWAY_PASSWORD=123456
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - ORDER_PAYMENTS_QUEUE_NAME=${ORDER_PAYMENTS_QUEUE_NAME:-order-payments-queue}
      - PAYMENT_STATUS_TOPIC_ARN=${PAYMENT_STATUS_TOPIC_ARN}
    depends_on:
      payments-db:
        condition: service_healthy
    networks:
      - soat-net
    ports:
      - "8082:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payments-db:
    image: postgres:17-alpine
    container_name: payments-db
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123456
    ports:
      - "5434:5432"
    networks:
      - soat-net
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d payments" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  soat-net:
    driver: bridge
    name: soat-net

volumes:
  payments-data:
    name: payments-data
